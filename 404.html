<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 页面不存在 — ShiLong Li</title>
  <meta name="description" content="这页笔记不存在，回到首页继续阅读。">
  <meta name="theme-color" content="#f4f2ea">
  <meta name="robots" content="noindex">
  <script>
    (() => {
      const root = document.documentElement;
      let choice = 'system';
      try {
        const stored = localStorage.getItem('shilong-theme');
        if (stored === 'system' || stored === 'light' || stored === 'dark') choice = stored;
      } catch {}
      root.dataset.themeChoice = choice;
      if (choice === 'light' || choice === 'dark') root.dataset.theme = choice;
      const dark = choice === 'dark' || (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      const reading = root.classList.contains('reading');
      root.style.colorScheme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content =
        dark ? (reading ? '#0e1013' : '#15171a') : (reading ? '#ffffff' : '#f4f2ea');
    })();
  </script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/theme.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="/">ShiLong Li<span>技术笔记</span></a>
    <div class="header-actions">
      <nav class="site-nav" aria-label="主导航">
        <a href="/">首页</a>
        <a href="https://github.com/ShiLong-CN" rel="me">GitHub</a>
      </nav>
      <div class="theme-switcher" role="group" aria-label="显示主题">
        <button type="button" data-theme-value="system" aria-pressed="true">自动</button>
        <button type="button" data-theme-value="light" aria-pressed="false">浅色</button>
        <button type="button" data-theme-value="dark" aria-pressed="false">深色</button>
      </div>
    </div>
  </header>

  <main id="main" class="shell">
    <section class="notice" aria-labelledby="error-title">
      <p class="eyebrow">404 · Not found</p>
      <h1 id="error-title">这页笔记还不存在。</h1>
      <p>地址可能有误，或者文章已经移动。</p>
      <p><a href="/">← 返回全部笔记</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 ShiLong Li</p>
    <p><a href="https://github.com/ShiLong-CN">github.com/ShiLong-CN</a></p>
  </footer>
</body>
</html>
